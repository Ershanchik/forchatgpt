apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: node:22-alpine
      workingDir: $(workspaces.source.path)/tax-calculator
      script: |
        #!/bin/sh
        set -eu
        npm install --no-audit --no-fund
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: node:22-alpine
      workingDir: $(workspaces.source.path)/tax-calculator
      script: |
        #!/bin/sh
        set -eu
        npx jasmine

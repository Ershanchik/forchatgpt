apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository containing the tax-calculator directory
    - name: image
      type: string
      description: Build target image reference; test build intentionally does not push
  workspaces:
    - name: shared
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
      workspaces:
        - name: output
          workspace: shared
    - name: npminstall
      runAfter: [clone]
      taskRef:
        name: npm
      workspaces:
        - name: source
          workspace: shared
    - name: tests
      runAfter: [npminstall]
      taskRef:
        name: jasmine
      workspaces:
        - name: source
          workspace: shared
    - name: build
      runAfter: [tests]
      taskRef:
        name: kaniko-local
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: shared

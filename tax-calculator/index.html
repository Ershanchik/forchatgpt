<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tax Calculator</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script defer src="taxCalculator.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main>
    <h1>Tax Calculator</h1>
    <p>Calculate estimated tax using a flat percentage rate.</p>
    <form id="calculator">
      <label for="income">Income</label>
      <input id="income" name="income" type="number" min="0" step="0.01" value="50000" required>
      <label for="rate">Tax rate (%)</label>
      <input id="rate" name="rate" type="number" min="0" max="100" step="0.01" value="15" required>
      <button type="submit">Calculate tax</button>
    </form>
    <output id="result" aria-live="polite"></output>
    <small>Educational example only; not a jurisdiction-specific tax estimate.</small>
  </main>
</body>
</html>

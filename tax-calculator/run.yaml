apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/Ershanchik/forchatgpt.git
    - name: image
      value: icr.io/REPLACE_WITH_YOUR_NAMESPACE/tax-calculator:latest
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
